<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="75%">
      <stop offset="0%" stop-color="#18305a"/>
      <stop offset="54%" stop-color="#0a1428"/>
      <stop offset="100%" stop-color="#050b18"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f8be8" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#4f8be8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4f8be8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c4f93"/>
      <stop offset="100%" stop-color="#14264a"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#65d0ff"/>
      <stop offset="100%" stop-color="#4f8be8"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f8be8"/>
      <stop offset="100%" stop-color="#65d0ff"/>
    </linearGradient>
    <linearGradient id="shim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="barclip"><rect x="380" y="356" width="440" height="7" rx="3.5"/></clipPath>

    <style>
      @keyframes rise { from { opacity:0; transform: translateY(28px); } to { opacity:1; transform: translateY(0); } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
      @keyframes pulse { 0%,100% { opacity:.30; transform: scale(1); } 50% { opacity:.55; transform: scale(1.07); } }
      @keyframes fill { 0% { transform: scaleX(0); } 62% { transform: scaleX(1); } 100% { transform: scaleX(1); } }
      @keyframes sweep { 0% { transform: translateX(-160px); } 100% { transform: translateX(600px); } }
      @keyframes blink { 0%,100% { opacity:.55; } 50% { opacity:1; } }

      .rise  { opacity:0; animation: rise .9s cubic-bezier(.2,.8,.25,1) .15s forwards; }
      .rise2 { opacity:0; animation: rise .8s cubic-bezier(.2,.8,.25,1) .8s  forwards; }
      .rise3 { opacity:0; animation: rise .7s ease-out 1.15s forwards; }
      .float { animation: float 5s ease-in-out 1.1s infinite; }
      .halo  { transform-box: fill-box; transform-origin: center; animation: pulse 4s ease-in-out infinite; }
      .fill  { transform-box: fill-box; transform-origin: left center; animation: fill 2.6s cubic-bezier(.4,0,.2,1) 1.3s infinite; }
      .shim  { animation: sweep 1.5s ease-in-out 1.3s infinite; }
      .dot   { animation: blink 1.4s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1200" height="470" fill="url(#bg)"/>
  <ellipse class="halo" cx="600" cy="158" rx="240" ry="150" fill="url(#halo)"/>

  <!-- Monograma M (mesmos pontos do logo real): corpo navy + braço azul -->
  <g class="rise">
    <g class="float">
      <g transform="translate(600,158) scale(1.04) translate(-100,-101)">
        <polygon fill="url(#arm)" filter="url(#soft)" opacity="0.85"
          points="100,110 148,20 150,92 100,150"/>
        <polygon fill="url(#navy)" stroke="#4f8be8" stroke-opacity="0.35" stroke-width="1.5"
          points="12,182 12,20 52,20 100,110 148,20 188,20 188,182 150,182 150,92 100,150 50,92 50,182"/>
        <polygon fill="url(#arm)"
          points="100,110 148,20 150,92 100,150"/>
      </g>
    </g>
  </g>

  <!-- Wordmark FINANCE com linhas laterais -->
  <g class="rise2">
    <line x1="392" y1="300" x2="470" y2="300" stroke="#4f8be8" stroke-opacity="0.6" stroke-width="1.4"/>
    <line x1="730" y1="300" x2="808" y2="300" stroke="#4f8be8" stroke-opacity="0.6" stroke-width="1.4"/>
    <text x="601" y="309" text-anchor="middle" fill="#dce8fb"
      font-size="34" font-weight="600" letter-spacing="20">FINANCE</text>
  </g>

  <!-- Barra de carregamento -->
  <g class="rise3">
    <rect x="380" y="356" width="440" height="7" rx="3.5" fill="#7896c8" fill-opacity="0.16"/>
    <g clip-path="url(#barclip)">
      <rect class="fill" x="380" y="356" width="440" height="7" rx="3.5" fill="url(#barGrad)" filter="url(#soft)"/>
      <rect class="fill" x="380" y="356" width="440" height="7" rx="3.5" fill="url(#barGrad)"/>
      <rect class="shim" x="380" y="356" width="150" height="7" fill="url(#shim)"/>
    </g>
    <text x="600" y="393" text-anchor="middle" fill="#7d93b8" font-size="13" font-weight="500" letter-spacing="3.5">PREPARANDO SEU TERMINAL FINANCEIRO<tspan class="dot" fill="#65d0ff"> ●</tspan></text>
  </g>
</svg>
